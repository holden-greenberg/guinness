<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a08" />
  <title>Games — The Dead Poet Guinness Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0b08'/%3E%3Crect x='8' y='6' width='16' height='4' rx='2' fill='%23f6efe1'/%3E%3Crect x='9' y='11' width='14' height='15' rx='2' fill='%231a1512' stroke='%23d4a94e'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-head">
    <h1>The Dead Poet</h1>
    <p class="tagline">Card game rules</p>
    <nav class="tabs">
      <a href="/" class="tab">Counter</a>
      <a href="/history" class="tab">History</a>
      <a href="/games" class="tab" aria-current="page">Games</a>
      <a href="/food" class="tab">Food</a>
    </nav>
  </header>

  <main id="games">
    <section class="ask-card">
      <h2 class="ask-title">Ask about the rules</h2>
      <label class="field">
        <span class="field-label">Game</span>
        <select id="gameSelect" class="field-select"></select>
      </label>
      <label class="field">
        <span class="field-label">Question</span>
        <textarea id="question" class="field-textarea" rows="3"
          placeholder="e.g. Can you slap on a sandwich if the middle card is a face card?"></textarea>
      </label>
      <button type="button" class="ask-btn" id="askBtn">Ask</button>
      <p class="ask-disclaimer">
        AI answers can be wrong. The official rules link is the tiebreaker.
      </p>
      <div id="answers" class="answers"></div>
    </section>

    <section id="gameList" class="game-list" aria-live="polite">
      <p class="loading">Loading games&hellip;</p>
    </section>
  </main>

  <footer class="site-foot">
    <span id="status" class="status"></span>
  </footer>

  <script src="./games.js"></script>
</body>
</html>
