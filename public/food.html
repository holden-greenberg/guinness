<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0b08" />
  <title>Food — The Dead Poet Guinness Challenge</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0b08'/%3E%3Crect x='8' y='6' width='16' height='4' rx='2' fill='%23f6efe1'/%3E%3Crect x='9' y='11' width='14' height='15' rx='2' fill='%231a1512' stroke='%23d4a94e'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-head">
    <h1>The Dead Poet</h1>
    <p class="tagline">What are we eating?</p>
    <nav class="tabs">
      <a href="/" class="tab">Counter</a>
      <a href="/history" class="tab">History</a>
      <a href="/games" class="tab">Games</a>
      <a href="/food" class="tab" aria-current="page">Food</a>
    </nav>
  </header>

  <main id="food">
    <section class="ask-card decide-card">
      <h2 class="ask-title">Dinner call</h2>

      <div class="field">
        <span class="field-label">Hunger</span>
        <div class="seg" id="hungerSeg" role="group" aria-label="Hunger"></div>
      </div>

      <div class="field">
        <span class="field-label">Craving</span>
        <div class="chips" id="cuisineChips"></div>
        <input type="text" id="craving" maxlength="200"
          placeholder="…or say what you're feeling (spicy, greasy, light)" />
      </div>

      <div class="field">
        <span class="field-label">Budget</span>
        <div class="seg" id="budgetSeg" role="group" aria-label="Budget"></div>
      </div>

      <div class="field">
        <span class="field-label">Walk up to <b id="walkVal">12</b> min</span>
        <input type="range" id="walk" class="range" min="5" max="25" step="1" value="12" />
      </div>

      <button type="button" class="ask-btn" id="findBtn">Find food</button>
      <p class="ask-disclaimer">
        Places and hours come from OpenStreetMap and can be out of date — tap through to confirm.
      </p>
    </section>

    <section id="results" class="pick-list" aria-live="polite"></section>
  </main>

  <footer class="site-foot">
    <span id="status" class="status"></span>
  </footer>

  <script src="./food.js"></script>
</body>
</html>
