<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a08" />
  <title>Food — The Dead Poet Guinness Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0b08'/%3E%3Crect x='8' y='6' width='16' height='4' rx='2' fill='%23f6efe1'/%3E%3Crect x='9' y='11' width='14' height='15' rx='2' fill='%231a1512' stroke='%23d4a94e'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-head">
    <h1>The Dead Poet</h1>
    <p class="tagline">What are we bringing back?</p>
    <nav class="tabs">
      <a href="/" class="tab">Counter</a>
      <a href="/history" class="tab">History</a>
      <a href="/games" class="tab">Games</a>
      <a href="/food" class="tab" aria-current="page">Food</a>
    </nav>
  </header>

  <main id="food">
    <section>
      <span class="mood-label" id="moodLabel">In the mood for</span>
      <div class="seg" id="moods" role="group" aria-labelledby="moodLabel"></div>
    </section>

    <section id="results" class="pick-list" aria-live="polite">
      <p class="loading">Finding food…</p>
    </section>

    <details class="ask-card more-options">
      <summary>More options</summary>

      <div class="field">
        <span class="field-label">Plan</span>
        <div class="seg" id="plan" role="group" aria-label="Plan"></div>
      </div>

      <div class="field">
        <label class="field-label" for="walk">Walk up to <b id="walkVal">8</b> min</label>
        <input type="range" id="walk" class="range" min="5" max="25" step="1" value="8" />
      </div>

      <div class="field">
        <span class="field-label">Cuisine</span>
        <div class="chips" id="cuisineChips"></div>
      </div>

      <div class="field">
        <label class="field-label" for="query">Looking for something specific?</label>
        <input type="text" id="query" maxlength="60" placeholder="dumplings, Ray's…" />
      </div>
    </details>

    <p class="food-note">
      Places and health grades come from NYC inspection records, hours from OpenStreetMap.
      Call to confirm before you walk over.
    </p>
  </main>

  <script src="./food.js"></script>
</body>
</html>
