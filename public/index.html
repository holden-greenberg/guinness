<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0b08" />
  <title>The Dead Poet — Guinness Challenge</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230e0b08'/%3E%3Crect x='8' y='6' width='16' height='4' rx='2' fill='%23f6efe1'/%3E%3Crect x='9' y='11' width='14' height='15' rx='2' fill='%231a1512' stroke='%23d4a94e'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="site-head">
    <h1>The Dead Poet</h1>
    <p class="tagline">Guinness Challenge &middot; 100 to the wall</p>
    <nav class="tabs">
      <a href="/" class="tab" aria-current="page">Counter</a>
      <a href="/history" class="tab">History</a>
      <a href="/games" class="tab">Games</a>
    </nav>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Pouring&hellip;</p>
  </main>

  <section class="session" id="session" hidden>
    <div class="session-count">
      <span class="session-label">Tonight</span>
      <span class="session-total" id="sessionTotal">0</span>
    </div>
    <div class="session-btns">
      <button type="button" class="btn-save" id="saveBtn" hidden>Save to history</button>
      <button type="button" class="btn-reset" id="resetBtn">Reset tonight</button>
    </div>
  </section>

  <footer class="site-foot">
    <span id="status" class="status"></span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
